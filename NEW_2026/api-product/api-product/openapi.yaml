openapi: "3.1.0"
info:
  title: Product API
  version: "1.0.0"
  description: REST API CRUD produk — daftar, detail, tambah, ubah, dan hapus produk.

servers:
  - url: http://localhost:3000
    description: Local development server

tags:
  - name: Products
    description: Operasi CRUD produk

paths:
  /api/products:
    get:
      tags: [Products]
      summary: Ambil semua produk
      operationId: listProducts
      responses:
        "200":
          description: Daftar semua produk berhasil diambil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductListResponse"
              example:
                data:
                  - id: 1
                    name: Kaos Katun Polos
                    price: 150000
                    image: https://example.com/kaos-katun.png
                    variants:
                      colorOrSize: [S, M, L]
                      quantity: 30
                    description: Kaos katun nyaman untuk penggunaan sehari hari.
                meta:
                  total: 1
        "500":
          $ref: "#/components/responses/InternalServerError"

    post:
      tags: [Products]
      summary: Buat produk baru
      operationId: createProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
            examples:
              valid:
                summary: Body valid
                value:
                  name: Kaos Katun Polos
                  price: 150000
                  image: https://example.com/kaos-katun.png
                  variants:
                    colorOrSize: [S, M, L]
                    quantity: 10
                  description: Kaos katun nyaman untuk penggunaan sehari hari.
              validation_fail:
                summary: Body tidak valid
                value:
                  name: ""
                  price: -1
                  image: bukan-url
                  variants:
                    colorOrSize: []
                    quantity: -5
                  description: ""
      responses:
        "201":
          description: Produk berhasil dibuat
          headers:
            Location:
              description: URL produk yang baru dibuat
              schema:
                type: string
                example: /api/products/1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
              example:
                data:
                  id: 1
                  name: Kaos Katun Polos
                  price: 150000
                  image: https://example.com/kaos-katun.png
                  variants:
                    colorOrSize: [S, M, L]
                    quantity: 30
                  description: Kaos katun nyaman untuk penggunaan sehari hari.
                meta: {}
        "400":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/products/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: ID numerik produk (integer positif)
        schema:
          type: integer
          format: int64
          minimum: 1
          example: 1

    get:
      tags: [Products]
      summary: Ambil detail satu produk
      operationId: getProduct
      responses:
        "200":
          description: Produk ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
              example:
                data:
                  id: 1
                  name: Kaos Katun Polos
                  price: 150000
                  image: https://example.com/kaos-katun.png
                  variants:
                    colorOrSize: [S, M, L]
                    quantity: 30
                  description: Kaos katun nyaman untuk penggunaan sehari hari.
                meta: {}
        "400":
          $ref: "#/components/responses/InvalidIdError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalServerError"

    put:
      tags: [Products]
      summary: Ganti seluruh data produk (full replacement)
      operationId: replaceProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
            example:
              name: Kaos Katun Premium
              price: 200000
              image: https://example.com/kaos-premium.png
              variants:
                colorOrSize: [S, M, L, XL]
                quantity: 20
              description: Kaos katun premium bahan halus.
      responses:
        "200":
          description: Produk berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalServerError"

    delete:
      tags: [Products]
      summary: Hapus produk
      operationId: deleteProduct
      responses:
        "204":
          description: Produk berhasil dihapus (no content)
        "400":
          $ref: "#/components/responses/InvalidIdError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  schemas:
    Product:
      type: object
      required: [id, name, price, image, images, variants, description]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          example: 1
        name:
          type: string
          minLength: 1
          maxLength: 120
          example: Kaos Katun Polos
        price:
          type: integer
          format: int64
          minimum: 0
          example: 150000
        image:
          type: string
          format: uri
          maxLength: 2048
          example: https://example.com/kaos-katun.png
        images:
          type: array
          description: Galeri foto produk. Item pertama selalu sama dengan image.
          minItems: 1
          maxItems: 10
          items:
            type: string
            format: uri
            maxLength: 2048
          example: [https://example.com/kaos-katun.png, https://example.com/kaos-katun-2.png]
        variants:
          type: object
          required: [colorOrSize, quantity]
          properties:
            colorOrSize:
              type: array
              minItems: 1
              items:
                type: string
                minLength: 1
                maxLength: 50
              example: [S, M, L]
            quantity:
              type: integer
              minimum: 0
              example: 30
        description:
          type: string
          minLength: 1
          maxLength: 2000
          example: Kaos katun nyaman untuk penggunaan sehari hari.

    ProductInput:
      type: object
      additionalProperties: false
      required: [name, price, image, variants, description]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        price:
          type: integer
          format: int64
          minimum: 0
        image:
          type: string
          format: uri
          maxLength: 2048
        images:
          type: array
          description: Opsional. Foto tambahan untuk galeri. image otomatis ditaruh di urutan pertama, duplikat dibuang, total maksimal 10.
          maxItems: 10
          items:
            type: string
            format: uri
            maxLength: 2048
        variants:
          $ref: "#/components/schemas/VariantsInput"
        description:
          type: string
          minLength: 1
          maxLength: 2000

    VariantsInput:
      type: object
      additionalProperties: false
      required: [colorOrSize, quantity]
      properties:
        colorOrSize:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
            maxLength: 50
        quantity:
          type: integer
          minimum: 0

    ProductResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/Product"
        meta:
          type: object
          additionalProperties: true

    ProductListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        meta:
          type: object
          required: [total]
          properties:
            total:
              type: integer
              minimum: 0

    ProblemDetails:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
              message:
                type: string

  responses:
    ValidationError:
      description: Validasi request body gagal
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: https://api.example.com/problems/validation-error
            title: Request validation failed
            status: 400
            detail: One or more request fields are invalid
            instance: /api/products
            errors:
              - field: price
                message: Price must be a non-negative integer
              - field: name
                message: name must not be empty

    InvalidIdError:
      description: ID produk tidak valid
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: https://api.example.com/problems/invalid-product-id
            title: Invalid product ID
            status: 400
            detail: Product ID must be a positive integer
            instance: /api/products/abc

    NotFoundError:
      description: Produk tidak ditemukan
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: https://api.example.com/problems/product-not-found
            title: Product not found
            status: 404
            detail: No product exists with ID 999999
            instance: /api/products/999999

    InternalServerError:
      description: Error tak terduga di server
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: about:blank
            title: Internal Server Error
            status: 500
            detail: An unexpected error occurred
